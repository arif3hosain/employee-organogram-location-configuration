server:
  port: 8080

spring:
  application:
    name: pms-poc
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pmspoc}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false          # views are built inside service transactions
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

pms:
  tenancy:
    header: X-Tenant-Id
    # POC only: requests without the header act as tenant 1 so the current UI keeps working.
    # Remove in the product: the tenant must come from the signed-in user's token.
    default-tenant-id: 1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.bracits.pms: DEBUG
    # org.hibernate.SQL: DEBUG   # uncomment to see SQL
